<!-- ==========================================================================
     미아클 — CONTACT 섹션 템플릿
     치환 자리는 build.js 가 src/copy.json 의 문구로 채웁니다.
     --------------------------------------------------------------------------
     아임웹 "코드 위젯"에 붙여넣는 블록입니다.
     이 블록 바로 아래에 "입력폼 위젯"(board_code=b202609115a34b122e2d20)을 놓으면
     contact-form.js 가 폼을 아래 .atm-contact__slot 안으로 옮겨 넣습니다.
     ========================================================================== -->

<!-- data-atm-theme: "dark" | "light" | "auto"  ← 이 값만 바꾸면 전체 톤이 바뀝니다. -->
<section class="atm-contact" id="contact" data-atm-theme="{{THEME}}"
         aria-labelledby="atm-contact-title">
  <div class="atm-contact__inner">

    <!-- ── 왼쪽: 안내 + 직접 연락처 ───────────────────────────────────── -->
    <div class="atm-contact__aside">
      <span class="atm-contact__eyebrow">{{EYEBROW}}</span>

      <h2 class="atm-contact__title" id="atm-contact-title">{{TITLE}}</h2>

      <p class="atm-contact__lead">{{LEAD}}</p>

      <dl class="atm-contact__info">

        <div class="atm-contact__info-row">
          <dt class="atm-contact__info-label">Email</dt>
          <dd class="atm-contact__info-value">
            <a href="mailto:miaclife@naver.com">miaclife@naver.com</a>
          </dd>
        </div>

        <div class="atm-contact__info-row">
          <dt class="atm-contact__info-label">Phone</dt>
          <dd class="atm-contact__info-value">
            <a href="tel:0507-1379-5380">0507-1379-5380</a>
            <span class="atm-contact__info-sub">평일 10:00 – 18:00 (주말·공휴일 휴무)</span>
          </dd>
        </div>

        <div class="atm-contact__info-row">
          <dt class="atm-contact__info-label">Studio</dt>
          <dd class="atm-contact__info-value">
            경북 포항시 북구 흥해읍 한동로40번길 20
            <span class="atm-contact__info-sub">방문 상담은 사전 예약제로 운영됩니다.</span>
          </dd>
        </div>

      </dl>
    </div>

    <!-- ── 오른쪽: 입력폼이 들어앉는 카드 ─────────────────────────────── -->
    <div class="atm-contact__panel">
      <h3 class="atm-contact__panel-title">{{PANEL_TITLE}}</h3>
      <p class="atm-contact__panel-desc">{{PANEL_DESC}}</p>

      <!-- 필수/선택 범례 — 폼 위에 항상 보이도록 둡니다. -->
      <p class="atm-contact__legend">
        <span class="atm-contact__legend-req">*</span> 필수 항목
        <span class="atm-contact__legend-sep" aria-hidden="true"></span>
        <span class="atm-optional atm-optional--legend">선택</span> 없어도 접수됩니다
      </p>

      <!-- 아임웹 입력폼 위젯이 이 안으로 이동합니다. 비워두세요. -->
      <div class="atm-contact__slot"></div>

      <p class="atm-contact__footnote">
        보내주신 내용은 상담 목적으로만 사용되며, 목적 달성 후 지체 없이 파기합니다.
        보다 빠른 상담이 필요하시면 전화 또는 이메일로 연락해 주세요.
      </p>
    </div>

  </div>
</section>
